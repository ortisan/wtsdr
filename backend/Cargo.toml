[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7.1"
actix-web = "4.13.0"
argon2 = "0.5.3"
async-trait = "0.1.89"
aws-config = "1.8.14"
aws-sdk-s3 = "1.124.0"
bytes = "1.11.1"
chrono = { version = "0.4.43", features = ["serde"] }
diesel = { version = "2.3.6", features = ["postgres", "uuid", "chrono", "r2d2"] }
dotenvy = "0.15.7"
env_logger = "0.11.9"
jsonwebtoken = "10.3.0"
log = "0.4.29"
postgis_diesel = "3.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
utoipa = { version = "5.4.0", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"] }
uuid = { version = "1.21.0", features = ["serde", "v7"] }
